name: Agents

# Claude, working on the repository:
#
# - An issue labelled `agent` (her "Report a problem" reports arrive that way,
#   and anyone with triage access can add the label): Claude fixes it and
#   opens a pull request, which merges itself once Checks pass.
# - "@claude" in an issue or pull request comment, from someone with write
#   access: Claude does what's asked there.
#
# Billed to the Claude subscription through CLAUDE_CODE_OAUTH_TOKEN (set up by
# `/install-github-app` in Claude Code).

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: agents-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  work:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'agent') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # So the agent can run the same tests Checks will.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: npx playwright install --with-deps chromium

      - name: Fix the issue
        if: github.event_name == 'issues'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Fix GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            Read CLAUDE.md first and follow it, especially "Working as an agent".

            1. Understand the issue (`gh issue view ${{ github.event.issue.number }}`). If it came from the owner
               (label from-boss), it is in her words; work out what she ran into from the page it names. Family
               names and numbers in it were replaced with [name], [phone] and so on.
            2. Reproduce it with a failing test where you can (tests/integration or tests/e2e), then fix it.
            3. Run the checks: `npx tsc --noEmit -p apps/web`, `npm test`, and `npm run test:e2e`
               (the local Supabase stack is already running).
            4. If what she sees changes, update the tour (apps/web/src/components/guided-tour.tsx), Help
               (apps/web/src/lib/help/content.ts) and the test plan (apps/web/src/lib/help/acceptance-cases.json).
            5. Commit on a new branch and open a pull request whose title is a conventional commit
               ("fix(area): what is now right", or "feat(area): ...") and whose body says
               "Fixes #${{ github.event.issue.number }}" and, in a sentence she would understand, what changed for her.

            If code can't fix it (a question, a setting she can change, a bank email that never arrived), don't
            open a pull request: comment on the issue with what to do instead, in plain words.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh:*),Bash(supabase status:*),Bash(docker exec:*),Edit,Write,Read,Glob,Grep"

      - name: Do what the comment asks
        if: github.event_name != 'issues'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh:*),Bash(supabase status:*),Bash(docker exec:*),Edit,Write,Read,Glob,Grep"
