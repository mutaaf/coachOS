name: Checks

# Everything a change must pass before it can reach the owner. Runs on every
# pull request (required by branch protection), every morning against main,
# and as the first stage of Ship.

on:
  pull_request:
  schedule:
    # Every morning, so a break is found before the week's sessions start
    # rather than while someone is trying to register a child.
    - cron: "0 12 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional commit title
        # The squash-merge commit takes the PR title, and the release reads it:
        # feat → minor, fix → patch, a "!" → major. See docs/RELEASING.md.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^(feat|fix|perf|refactor|revert|security|chore|docs|test|ci|build|style)(\([a-z0-9-]+\))?!?:\ .+ ]]; then
            echo "::error::PR title must look like 'feat(payments): record cash from anyone' — got: $TITLE"
            exit 1
          fi

  static:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p apps/web
      - name: Production build
        working-directory: apps/web
        env:
          # Placeholders: the build must not depend on reaching a database.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only
          SUPABASE_SERVICE_ROLE_KEY: build-only
        run: npx next build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: New, well-named, in order, and not destructive without sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash scripts/check-migrations.sh

  test:
    name: Integration and run-book
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ — supabase-js needs a native WebSocket, which Node 20 lacks.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start the local Supabase stack
        # The same throwaway database the tests use locally: every migration
        # applied to an empty Postgres, so a migration that cannot build from
        # scratch fails here rather than in production.
        run: supabase start

      - name: Integration tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests, including the run-book
        run: npm run test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: test-results/
          retention-days: 7
