name: Ship

# main → production, one merge at a time:
#
#   checks → migrate the database → deploy → smoke test → release notes
#
# A smoke test that fails rolls production back to the previous deploy and
# opens an issue. Migrations run first because the new code may need them;
# that is why they must be additive (see scripts/check-migrations.sh) — the
# old code keeps running against the new schema until the deploy lands.
#
# Until vars.SHIP_DEPLOYS is 'true', Vercel still deploys main from git and
# this workflow only migrates, waits for that deploy, checks it and releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: read

env:
  APP_URL: ${{ vars.APP_URL || 'https://app.risingstars.training' }}
  SUPABASE_PROJECT_REF: anzzhodsulqygshhptzt

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  migrations:
    name: Migration rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rules for this push, with the merged PR's labels
        env:
          BASE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export LABELS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[0].labels[].name]' 2>/dev/null || echo '[]')
          bash scripts/check-migrations.sh

  deploy:
    name: Migrate, deploy, smoke test
    needs: [checks, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SHIP_DEPLOYS: ${{ vars.SHIP_DEPLOYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Migrate production
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          # The CLI was once linked to a different project; never push without checking.
          test "$(cat supabase/.temp/project-ref)" = "$SUPABASE_PROJECT_REF"
          supabase db push --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy to production
        id: deploy
        if: env.SHIP_DEPLOYS == 'true'
        run: |
          npm ci
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          # Baked into the build, so /api/health names the build that is serving.
          NEXT_PUBLIC_APP_SHA="$GITHUB_SHA" npx vercel build --prod --token="$VERCEL_TOKEN"
          url=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"

      - name: Smoke test
        run: |
          set -euo pipefail
          # Wait for this commit to be the one serving (a git deploy takes a few minutes).
          for i in $(seq 1 60); do
            body=$(curl -fsS "$APP_URL/api/health" || true)
            echo "$body"
            if echo "$body" | grep -q "\"sha\":\"$GITHUB_SHA\"" && echo "$body" | grep -q '"database":"ok"'; then
              break
            fi
            [ "$i" = 60 ] && { echo "::error::$GITHUB_SHA never came up healthy"; exit 1; }
            sleep 10
          done
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          [ "$(code "$APP_URL/login")" = 200 ] || { echo "::error::/login is not 200"; exit 1; }
          # Signed out, the dashboard sends you to sign in rather than showing anything.
          [ "$(curl -s -o /dev/null -w '%{redirect_url}' "$APP_URL/payments")" = "$APP_URL/login" ] || { echo "::error::/payments did not redirect to /login"; exit 1; }
          [ "$(code "$APP_URL/pay/AAAAAAAAAAAAAAAAAAAAAAAA")" = 404 ] || { echo "::error::an unknown pay link did not 404"; exit 1; }
          echo "Healthy."

      - name: Roll back
        if: failure() && steps.deploy.outputs.url != ''
        run: npx vercel rollback --yes --token="$VERCEL_TOKEN"

      - name: Say so
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --label ship-failed --title "Ship failed for ${GITHUB_SHA::7}" --body "$(printf '%s\n' \
            "The deploy of ${GITHUB_SHA} did not pass. ${{ steps.deploy.outputs.url != '' && 'Production was rolled back to the previous deploy.' || 'Nothing was deployed by this run.' }}" \
            "" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "" \
            "Database migrations are not rolled back; they are additive, so the previous code runs against them.")" || true

  release:
    name: Release notes
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code, for the notes
        run: npm install -g @anthropic-ai/claude-code
      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RELEASE_SECRET: ${{ secrets.RELEASE_SECRET }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs
